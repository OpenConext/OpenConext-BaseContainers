version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      gha:
        update-types: [ "major", "minor", "patch" ]
    schedule:
      interval: "weekly"
    labels:
      - github-actions-update
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - docker-base-update
