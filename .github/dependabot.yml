---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      - dependency-type: "all"
    schedule:
      interval: "weekly"
    labels:
      - github-actions-update

  # ---- Docker groups – only patch updates ----
  - package-ecosystem: docker
    directory: "/apache2"
    schedule:
      interval: weekly
    groups:
      docker-patch:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-patch"
    open-pull-requests-limit: 5
    labels:
      - docker-base-update

