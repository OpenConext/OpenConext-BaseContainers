---
name: Build the HAProxy 2.8 (rootless) container

on:
  push:
    paths:
      - "haproxy28-rootless/**"
      - ".github/workflows/build-haproxy28-rootless.yaml"
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:

jobs:
  build-push-haproxy28-rootless:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./haproxy28-rootless
          platforms: linux/amd64,linux/arm64
          # only push the latest tag on the main branch
          push: "${{ github.ref == 'refs/heads/main' }}"
          tags: |
            ghcr.io/openconext/openconext-basecontainers/haproxy28-rootless:latest
            ghcr.io/openconext/openconext-basecontainers/haproxy28-rootless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
