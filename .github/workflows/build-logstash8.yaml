---
name: Build the Logstash8 container

on:
  push:
    paths:
      - "logstash8/**"
      - ".github/workflows/build-logstash8.yaml"
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build-push-logstash8:
    runs-on: "ubuntu-latest"
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "linux/amd64,linux/arm64"
          # The latest version will lead to segmentation fault.
          image: "tonistiigi/binfmt:qemu-v7.0.0-28"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "./logstash8"
          platforms: "linux/amd64,linux/arm64"
          # only push the latest tag on the main branch
          push: "${{ github.ref == 'refs/heads/main' }}"
          outputs: "type=image,name-canonical=true,push=true"
          tags: |
            ghcr.io/openconext/openconext-basecontainers/logstash8:latest
            ghcr.io/openconext/openconext-basecontainers/logstash8:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
