---
name: Build the Satosa container

on:
  push:
    paths:
      - "satosa/**"
      - ".github/workflows/build-satosa.yaml"
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build-push-satosa:
    runs-on: "ubuntu-22.04"
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "linux/amd64,linux/arm64"
          # The latest version will lead to segmentation fault.
          image: "tonistiigi/binfmt:qemu-v7.0.0-28"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "./satosa"
          platforms: "linux/amd64,linux/arm64"
          # only push the latest tag on the main branch
          # push: "${{ github.ref == 'refs/heads/main' }}"
          outputs: "type=image,push-by-digest=true,name-canonical=true,push=true"
          tags: |
            ghcr.io/openconext/openconext-basecontainers/satosa:latest
            ghcr.io/openconext/openconext-basecontainers/satosa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha
